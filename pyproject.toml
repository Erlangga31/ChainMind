[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chainmind"
version = "0.1.0"
description = "Autonomous manufacturing disruption response with human-approved procurement"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.34",
    "fastapi>=0.111",
    "httpx>=0.27",
    "mangum>=0.17",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/chainmind"]
include = ["src/chainmind/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "sandbox"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
