[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chainmind"
version = "1.1.1"
description = "Autonomous manufacturing disruption response with human-approved procurement"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.34",
    "fastapi>=0.111",
    "httpx>=0.27",
    "mangum>=0.17",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyJWT[crypto]>=2.10",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "aws-cdk-lib>=2.200.0",
    "cdk-nag>=2.35.0,<3.0.0",
    "constructs>=10.4.2,<11.0.0",
    "jsonschema>=4.22",
    "python-pptx>=1.0.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chainmind", "infra"]
include = ["src/chainmind/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "sandbox"]
filterwarnings = [
    # Starlette's deprecated httpx-backed test client is intentionally used by the local sandbox fixtures.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    # Mangum 0.x probes the current loop during adapter construction on Python 3.13.
    "ignore:There is no current event loop:DeprecationWarning:mangum.adapter",
]
markers = [
    "integration: requires a running LocalStack endpoint",
    "live_sap: opt-in smoke test against a real SAP tenant",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
