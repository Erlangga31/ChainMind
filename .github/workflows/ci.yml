name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install project and development dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests scripts infra sandbox
      - name: Check formatting
        run: uv run ruff format --check src tests scripts infra sandbox
      - name: Run tests
        run: uv run pytest -q

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard
      - name: Build dashboard
        run: npm run build
        working-directory: dashboard

  infra:
    name: Infrastructure synthesis
    runs-on: ubuntu-latest
    env:
      CDK_DEFAULT_ACCOUNT: "111111111111"
      CDK_DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install CDK dependencies
        run: python -m pip install -r requirements.txt
        working-directory: infra
      - name: Synthesize CDK templates
        run: npx --yes aws-cdk synth
        working-directory: infra
