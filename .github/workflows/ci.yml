name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install project and development dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests scripts infra sandbox
      - name: Check formatting
        run: uv run ruff format --check src tests scripts infra sandbox
      - name: Run tests
        run: uv run pytest -q -ra --tb=short --junitxml=pytest-report.xml
      - name: Publish concise pytest failures
        if: failure() && hashFiles('pytest-report.xml') != ''
        run: uv run python scripts/ci_annotate.py pytest-report.xml
      - name: Upload pytest report
        if: failure() && hashFiles('pytest-report.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: pytest-report.xml
          if-no-files-found: warn

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard
      - name: Build dashboard
        run: npm run build
        working-directory: dashboard
      - name: Test dashboard
        run: npm test
        working-directory: dashboard
      - name: Audit dashboard dependencies
        run: npm audit --audit-level=moderate
        working-directory: dashboard

  dashboard-e2e:
    name: Dashboard end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install project and development dependencies
        run: uv sync --extra dev
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard
      - name: Type-check browser tests
        run: npm run typecheck:e2e
        working-directory: dashboard
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - name: Run browser scenarios
        run: npm run test:e2e
        working-directory: dashboard

  compose:
    name: Local demo stack
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  infra:
    name: Infrastructure synthesis
    runs-on: ubuntu-latest
    env:
      CDK_DEFAULT_ACCOUNT: "111111111111"
      CDK_DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ChainMind package and CDK dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install infra requirements
        run: python -m pip install -r requirements.txt
        working-directory: infra
      - name: Synthesize CDK templates
        run: npx --yes aws-cdk synth
        working-directory: infra
